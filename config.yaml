FilterUS_YOU: &FilterUS_YOU '^(?=.*\[优\])(?=.*(?i)(美国|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(排除1|排除2))(?!.*(?i)lite).*$'
FilterUS_ZHONG: &FilterUS_ZHONG '^(?=.*\[中\])(?=.*(?i)(美国|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(排除1|排除2)).*$'
