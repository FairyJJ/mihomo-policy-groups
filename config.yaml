# ==================== 规则路由 ====================
rules:
  - DOMAIN-SUFFIX,sharepoint.com,直接连接

  # 拦截规则
  - RULE-SET,Tracking,REJECT
  - RULE-SET,Advertising,REJECT
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT  # 阻止海外 QUIC

  # 域名规则
  - RULE-SET,Private,直接连接
  - RULE-SET,AppleCN,直接连接

  # 人工智能拆分规则 - 顺序敏感：ChatGPT/Gemini/Copilot 必须在 AI 兜底规则之前
  # ChatGPT / OpenAI 域名（openai.mrs：openai.com、chatgpt.com、oaistatic.com、oaiusercontent.com、sora.com 等）
  - RULE-SET,OpenAI,ChatGPT
  # Gemini 域名（google-gemini.mrs：gemini.google.com、generativelanguage.googleapis.com、aistudio.google.com、notebooklm 等）
  - RULE-SET,Gemini,Gemini
  # Copilot 域名（官方仓库无独立 Copilot 规则集，使用内联规则，覆盖必应版 Copilot 与 GitHub Copilot）
  - DOMAIN-SUFFIX,copilot.microsoft.com,Copilot
  - DOMAIN-SUFFIX,copilot.cloud.microsoft,Copilot
  - DOMAIN-SUFFIX,microsoft-copilot.com,Copilot
  - DOMAIN-SUFFIX,copilot.com,Copilot
  - DOMAIN-SUFFIX,copilot-stg.com,Copilot
  - DOMAIN-SUFFIX,cocopilot.org,Copilot
  - DOMAIN-SUFFIX,githubcopilot.com,Copilot
  - DOMAIN-SUFFIX,githubnext.com,Copilot
  - DOMAIN-SUFFIX,copilot.github.com,Copilot
  - DOMAIN-SUFFIX,copilot-proxy.githubusercontent.com,Copilot
  - DOMAIN-SUFFIX,copilot-telemetry.githubusercontent.com,Copilot
  - DOMAIN-SUFFIX,copilot-telemetry-service.githubusercontent.com,Copilot
  - DOMAIN-SUFFIX,copilot-workspace.githubnext.com,Copilot
  - DOMAIN-SUFFIX,copilotprodattachments.blob.core.windows.net,Copilot
  - DOMAIN-SUFFIX,edgeservices.bing.com,Copilot
  - DOMAIN-SUFFIX,sydney.bing.com,Copilot
  - DOMAIN-SUFFIX,www.bing.com,Copilot
  # 其他AI兜底（category-ai-!cn.mrs：Claude/Anthropic、Grok、Perplexity、Cursor、xAI 等其余人工智能域名）
  - RULE-SET,AI,其他AI

  - DOMAIN-KEYWORD,speedtest,网络测试
  - RULE-SET,Speedtest,网络测试
  - RULE-SET,Telegram,电报消息
  - RULE-SET,SocialMedia,社交平台
  - RULE-SET,Games,游戏平台
  - RULE-SET,Crypto,货币平台
  # TikTok 需在 Streaming 之前匹配（category-entertainment.mrs 内也含 TikTok 域名）
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Streaming,国际媒体
  - RULE-SET,Apple,苹果服务
  - RULE-SET,Google,谷歌服务
  # GitHub 业务分组（github.mrs：github.com、githubusercontent.com、github.io、ghcr.io、npmjs、dependabot 等）
  # 必须置于 微软服务 之前 —— geosite/microsoft.mrs 同样包含全部 github 域名
  # Copilot 相关域名（githubcopilot.com、copilot-proxy.githubusercontent.com 等）已由上方内联规则先接走，不受影响
  - RULE-SET,GitHub,GitHub
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Facebook,脸书服务
  - RULE-SET,Proxy,国外流量
  - RULE-SET,China,国内流量

  # IP规则
  - RULE-SET,PrivateIP,直接连接,no-resolve
  - RULE-SET,TelegramIP,电报消息,no-resolve
  - RULE-SET,GoogleIP,谷歌服务,no-resolve
  - RULE-SET,FacebookIP,脸书服务,no-resolve
  - RULE-SET,ChinaIP,国内流量

  # 兜底规则
  - MATCH,兜底流量

