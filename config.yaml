FilterJP_BEI: &FilterJP_BEI '^(?=.*\[备\])(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(排除1|排除2)).*$'
FilterSG_YOU: &FilterSG_YOU '^(?=.*\[优\])(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*(排除1|排除2))(?!.*(?i)lite).*$'
FilterSG_ZHONG: &FilterSG_ZHONG '^(?=.*\[中\])(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*(排除1|排除2)).*$'
